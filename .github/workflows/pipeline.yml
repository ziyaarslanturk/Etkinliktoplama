name: Etkinlik Veri Boru Hattı

on:
  schedule:
    - cron: "0 */6 * * *"      # günde 4 kez (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "community_events/**"
      - "config/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verileri topla, doğrula, site/ klasörünü üret
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          PREVIOUS_EVENTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/events.json
        run: python -m pipeline.main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
