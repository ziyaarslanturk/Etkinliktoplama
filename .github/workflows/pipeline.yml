name: Event Collection Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          python -m unittest discover tests

      - name: Run Pipeline
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          PREVIOUS_EVENTS_URL: https://ziyaarslanturk.github.io/Etkinliktoplama/events.json
        run: |
          python -m pipeline.main

      - name: Commit and Push Generated Events
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A events.json events/
          if git diff --staged --quiet; then
            echo "No changes in generated events."
          else
            git commit -m "chore: auto-update generated event feeds [skip ci]"
            git push origin main
          fi
